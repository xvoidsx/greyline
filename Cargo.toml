[package]
name = "greyline"
version = "0.1.0"
edition = "2021"
description = "xvoidsx terminal music player — internet radio + local music"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rodio = "0.22"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
rustfft = "6.4.1"

[[bin]]
name = "greyline"
path = "src/main.rs"
